name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      draft:
        description: "Create as draft release"
        required: false
        default: false
        type: boolean

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  create-release:
    # Only run when commit message contains [build], or when manually dispatched.
    if: |
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.message, '[build]')
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      release_name: ${{ steps.meta.outputs.release_name }}
      draft: ${{ steps.meta.outputs.draft }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Get version from package.json
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Compute branch slug + release metadata
        id: meta
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          DRAFT: ${{ github.event.inputs.draft == 'true' }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # Slugify branch name for use in tag (replace anything not [A-Za-z0-9.] with '-').
          BRANCH_SLUG=$(echo "$REF_NAME" | sed -E 's/[^A-Za-z0-9.]+/-/g' | sed -E 's/^-+|-+$//g')
          TAG="${BRANCH_SLUG}-v${VERSION}"
          RELEASE_NAME="Nafaq ${BRANCH_SLUG} v${VERSION}"
          PRERELEASE="false"
          if [ "$REF_NAME" != "main" ]; then
            PRERELEASE="true"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "release_name=$RELEASE_NAME" >> "$GITHUB_OUTPUT"
          echo "draft=$DRAFT" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"

          NOTES=$(cat <<EOF
          ## $RELEASE_NAME

          ### macOS install

          After installing, macOS may require clearing the quarantine attribute once:

          \`\`\`sh
          xattr -cr "/Applications/Nafaq.app"
          \`\`\`
          EOF
          )

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists"
            exit 0
          fi

          if [ "$DRAFT" = "true" ]; then
            gh release create "$TAG" --target "$REF_NAME" --title "$RELEASE_NAME" --notes "$NOTES" --draft
          elif [ "$PRERELEASE" = "true" ]; then
            gh release create "$TAG" --target "$REF_NAME" --title "$RELEASE_NAME" --notes "$NOTES" --prerelease
          else
            gh release create "$TAG" --target "$REF_NAME" --title "$RELEASE_NAME" --notes "$NOTES"
          fi

  publish-desktop:
    needs: create-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
            arch: arm64
          - platform: macos-latest
            args: --target x86_64-apple-darwin
            arch: x64
          - platform: ubuntu-22.04
            args: ""
            arch: x64
          - platform: windows-latest
            args: ""
            arch: x64

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Cache bun dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: src-tauri -> target
          shared-key: ${{ matrix.platform }}-${{ matrix.arch }}

      - name: Install dependencies (Ubuntu only)
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Verify updater signing key
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "TAURI_SIGNING_PRIVATE_KEY is required for signed updater artifacts" >&2
            exit 1
          fi

      - name: Build and release
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_SIGNING_IDENTITY: "-"
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          CMAKE_POLICY_VERSION_MINIMUM: '3.5'
        with:
          tagName: ${{ needs.create-release.outputs.tag }}
          releaseName: ${{ needs.create-release.outputs.release_name }}
          releaseBody: ""
          releaseDraft: ${{ needs.create-release.outputs.draft == 'true' }}
          prerelease: ${{ needs.create-release.outputs.prerelease == 'true' }}
          args: ${{ matrix.args }}

  publish-android:
    needs: create-release
    permissions:
      contents: write
    runs-on: ubuntu-latest
    environment: Main
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Cache bun dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          targets: aarch64-linux-android

      - name: Rust cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: src-tauri -> target
          shared-key: android-arm64

      - name: Setup Java
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          # The default list includes the legacy "tools" package, which
          # current cmdline-tools no longer provide (sdkmanager exits 1).
          packages: platform-tools

      - name: Install Android SDK components
        run: |
          sdkmanager --sdk_root="$ANDROID_SDK_ROOT" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "platform-tools" \
            "ndk;26.1.10909125" \
            "cmake;3.22.1"

      - name: Export Android environment variables
        run: |
          echo "NDK_HOME=$ANDROID_SDK_ROOT/ndk/26.1.10909125" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/26.1.10909125" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/26.1.10909125" >> $GITHUB_ENV
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Initialize Android project (if missing)
        run: test -d src-tauri/gen/android || bun run tauri android init

      - name: Setup Android signing
        env:
          ANDROID_KEY_BASE64: ${{ secrets.ANDROID_SIGNING_KEY_STORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        run: |
          cd src-tauri/gen/android/app
          echo "$ANDROID_KEY_BASE64" | base64 -d > $RUNNER_TEMP/keystore.jks
          echo "storeFile=$RUNNER_TEMP/keystore.jks" > keystore.properties
          echo "storePassword=${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}" >> keystore.properties
          echo "keyAlias=$ANDROID_KEY_ALIAS" >> keystore.properties
          echo "password=$ANDROID_KEY_PASSWORD" >> keystore.properties

      - name: Build Android APK (release)
        run: bun run tauri android build --target aarch64
        env:
          CMAKE_POLICY_VERSION_MINIMUM: '3.5'

      - name: Upload Android artifacts to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK=$(find src-tauri/gen/android -path "*outputs*" -name "*release*.apk" ! -name "*unsigned*" | head -1)
          if [ -z "$APK" ]; then
            APK=$(find src-tauri/gen/android -path "*outputs*" -name "*release*.apk" | head -1)
          fi
          AAB=$(find src-tauri/gen/android -path "*outputs*" -name "*.aab" | head -1)
          TAG="${{ needs.create-release.outputs.tag }}"

          if [ -n "$APK" ]; then
            gh release upload "$TAG" "$APK" --clobber || echo "APK upload failed"
          fi
          if [ -n "$AAB" ]; then
            gh release upload "$TAG" "$AAB" --clobber || echo "AAB upload failed"
          fi

  updater-manifest:
    needs: [create-release, publish-desktop]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Compose and upload latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.create-release.outputs.tag }}
          VERSION: ${{ needs.create-release.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          WORK="$(mktemp -d)"
          cd "$WORK"

          ASSETS="$(gh release view "$TAG" --repo "$REPO" --json assets --jq '.assets[].name')"
          BASE_URL="https://github.com/$REPO/releases/download/$TAG"

          declare -A PATTERNS=(
            ["darwin-aarch64"]="aarch64.app.tar.gz"
            ["darwin-x86_64"]="x64.app.tar.gz"
            ["linux-x86_64"]="amd64.AppImage"
            ["windows-x86_64"]="x64-setup.exe"
          )

          PLATFORMS="{}"
          for TARGET in "${!PATTERNS[@]}"; do
            SUFFIX="${PATTERNS[$TARGET]}"
            ESC="$(printf '%s' "$SUFFIX" | sed 's/\./\\./g')"
            ART="$(printf '%s\n' "$ASSETS" | grep -E "${ESC}$" | head -1 || true)"
            if [ -z "$ART" ]; then
              echo "ERROR: missing updater artifact for $TARGET (*$SUFFIX)" >&2
              exit 1
            fi

            SIG_NAME="${ART}.sig"
            if ! printf '%s\n' "$ASSETS" | grep -qxF "$SIG_NAME"; then
              echo "ERROR: missing signature $SIG_NAME for $TARGET" >&2
              exit 1
            fi

            gh release download "$TAG" --repo "$REPO" --pattern "$SIG_NAME" --dir . --clobber
            SIG="$(cat "$SIG_NAME")"
            URL="$BASE_URL/$ART"
            PLATFORMS="$(printf '%s' "$PLATFORMS" | jq \
              --arg t "$TARGET" --arg s "$SIG" --arg u "$URL" \
              '. + {($t): {signature:$s, url:$u}}')"
          done

          jq -n \
            --arg v "$VERSION" \
            --arg notes "See https://github.com/$REPO/releases/tag/$TAG" \
            --argjson p "$PLATFORMS" \
            '{version:$v, notes:$notes, pub_date:(now|todate), platforms:$p}' > latest.json

          cat latest.json
          gh release upload "$TAG" latest.json --repo "$REPO" --clobber
